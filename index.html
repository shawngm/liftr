<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liftr Lounge</title>
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.9);
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-dark: #1c1c1e;
            --soft-gray: #f2f2f7;
            --card-radius: 24px;
        }

        * {
            box-sizing: border-box;
            max-width: 100%;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 1s ease-in-out;
            -webkit-font-smoothing: antialiased;
            color: #fff;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .overlay-dim {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.34);
            z-index: -1;
        }

        .header-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding-top: env(safe-area-inset-top, 18px);
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }

        .logo-container {
            padding: 14px 16px 4px;
            text-align: center;
        }

        .app-logo {
            height: 38px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .tabs {
            display: flex;
            overflow-x: auto;
            padding: 12px 14px 14px;
            gap: 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            border: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 999px;
            color: #fff;
            white-space: nowrap;
            transition: 0.25s;
            scroll-snap-align: start;
        }

        .tab-btn.active {
            background: #fff;
            color: #000;
            transform: scale(1.04);
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 16px 14px calc(120px + env(safe-area-inset-bottom, 0px));
        }

        .vibe-card,
        .exercise-card,
        .history-card,
        .protein-card,
        .setup-card {
            background: var(--glass);
            border-radius: var(--card-radius);
            padding: 18px;
            margin-bottom: 14px;
            color: #000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.28);
            backdrop-filter: blur(10px);
        }

        .vibe-label {
            font-size: 10px;
            font-weight: 900;
            color: var(--ios-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .quote {
            font-size: 17px;
            font-weight: 800;
            font-style: italic;
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .spotify-link,
        .small-btn,
        .finish-btn,
        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            font-weight: 900;
        }

        .spotify-link {
            background: #1DB954;
            color: #fff;
            padding: 11px 16px;
            border-radius: 999px;
            font-size: 13px;
        }

        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .shortcut-card {
            background: var(--glass);
            padding: 20px 10px;
            border-radius: 22px;
            color: #000;
            text-align: center;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.5);
            min-height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-wide {
            grid-column: span 2;
        }

        .ex-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .ex-name {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.15;
        }

        .ex-target {
            font-size: 11px;
            opacity: 0.62;
            font-weight: 800;
            white-space: nowrap;
            padding-top: 3px;
        }

        .last-line {
            background: #eef6ff;
            color: #0a4f91;
            border-radius: 14px;
            padding: 9px 11px;
            font-size: 13px;
            line-height: 1.25;
            font-weight: 800;
            margin: 0 0 10px;
        }

        .input-group {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            width: 100%;
        }

        .input-row-full {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            color: rgba(0,0,0,0.58);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            min-width: 0;
            background: var(--soft-gray);
            border: none;
            padding: 13px 12px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #000;
        }

        textarea {
            resize: vertical;
            min-height: 44px;
        }

        .small-btn {
            width: 100%;
            background: #e5f1ff;
            color: var(--ios-blue);
            padding: 11px 12px;
            border-radius: 14px;
            margin-top: 10px;
            font-size: 13px;
        }

        .finish-btn {
            background: #000;
            color: #fff;
            padding: 19px;
            border-radius: 20px;
            font-size: 18px;
            width: 100%;
            margin-top: 10px;
        }

        .secondary-btn {
            background: rgba(255,255,255,0.9);
            color: #000;
            padding: 14px;
            border-radius: 18px;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
        }

        .muted {
            color: rgba(0,0,0,0.62);
            font-size: 13px;
            line-height: 1.35;
            font-weight: 650;
        }

        .section-title {
            color: #fff;
            font-size: 22px;
            font-weight: 950;
            margin: 6px 2px 14px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.45);
        }

        .history-card strong,
        .protein-card strong {
            font-size: 16px;
        }

        .history-list {
            margin: 10px 0 0;
            padding-left: 16px;
            font-size: 13px;
            line-height: 1.45;
        }

        .progress-wrap {
            background: rgba(0,0,0,0.08);
            border-radius: 999px;
            height: 14px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            background: var(--ios-green);
            height: 100%;
            width: 0;
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .protein-total {
            font-size: 34px;
            font-weight: 950;
            line-height: 1;
            margin: 10px 0 2px;
        }

        .protein-log-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding: 10px 0;
            font-size: 14px;
            font-weight: 750;
        }

        .delete-btn {
            border: none;
            background: #ffe5e5;
            color: #b00020;
            border-radius: 999px;
            padding: 7px 10px;
            font-weight: 900;
            font-size: 12px;
        }

        #victoryOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        #victoryBadge {
            width: 80%;
            max-width: 300px;
            margin-bottom: 20px;
            transform: scale(0.5);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (max-width: 360px) {
            .container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            .input-row-full {
                grid-column: span 1;
            }

            .home-grid {
                grid-template-columns: 1fr;
            }

            .home-wide {
                grid-column: span 1;
            }

            .ex-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="overlay-dim"></div>

<div class="header-nav">
    <div class="logo-container">
        <img src="logo.png" class="app-logo" alt="Liftr Lounge">
    </div>
    <div class="tabs" id="tabBar">
        <button class="tab-btn active" onclick="showView('Home')">Lounge</button>
        <button class="tab-btn" onclick="showView('Chest & Shoulders')">Chest</button>
        <button class="tab-btn" onclick="showView('Legs & Glutes')">Legs</button>
        <button class="tab-btn" onclick="showView('Arms')">Arms</button>
        <button class="tab-btn" onclick="showView('Back/Shoulders/Core')">Back</button>
        <button class="tab-btn" onclick="showView('Protein')">Protein</button>
        <button class="tab-btn" onclick="showView('History')">History</button>
    </div>
</div>

<div class="container" id="content"></div>

<div id="victoryOverlay">
    <img src="" id="victoryBadge" alt="Badge">
    <h1 style="color:gold;">SESSION CRUSHED</h1>
    <p style="color:#fff;">Strength built. Mind centered.</p>
</div>

<script>
    const STORAGE_KEYS = {
        history: 'liftr_history_v2',
        legacyHistory: 'liftr_history',
        protein: 'liftr_protein_v1',
        proteinGoal: 'liftr_protein_goal'
    };

    const themes = {
        1: { name: "80s Arena Rock", bg: "bg1.jpg", badge: "badge1.png", playlist: "https://open.spotify.com/playlist/17BNbtuYjcjLjKF1mMXKpx?si=ba92dcfce1f749f5", quote: "“What stands in the way becomes the way.” — Marcus Aurelius" },
        2: { name: "Vaporwave / Lo-Fi", bg: "bg2.jpg", badge: "badge2.png", playlist: "https://open.spotify.com/playlist/4AH6HqwasXyLwaeDLvaHFv?si=45c9f9d9c7284810", quote: "“For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.” — 2 Timothy 1:7" },
        3: { name: "Heavenly Strength", bg: "bg3.jpg", badge: "badge3.png", playlist: "https://open.spotify.com/playlist/7CSCzfrGrTT1j1ie3n3HOf?si=41c6d0ac9b9347fe", quote: "\"God arms me with strength, and he makes my way perfect\" - Psalm 18:32" },
        4: { name: "Industrial Tech", bg: "bg4.jpg", badge: "badge4.png", playlist: "https://open.spotify.com/playlist/0z9tGa8xlumLE8NshMKQBH?si=2e3b0382697a43bf", quote: "“No man is free who is not master of himself.” — Epictetus" },
        5: { name: "Moody Nature / Zen", bg: "bg5.jpg", badge: "badge5.png", playlist: "https://open.spotify.com/playlist/0z9tGa8xlumLE8NshMKQBH?si=2e3b0382697a43bf", quote: "\"No discipline is enjoyable while it is happening—it’s painful! But afterward there will be a peaceful harvest...\" - Hebrews 12:11" }
    };

    const routines = {
        "Chest & Shoulders": [
            { name: "Incline Bench Press", target: "3x8-10", start: "35 lbs" },
            { name: "Chest Press Machine", target: "3x8-10", start: "25-30 lbs" },
            { name: "Shoulder Press", target: "3x8-10", start: "60 lbs" },
            { name: "Dumbbell Fly", target: "3x10-12", start: "20-25 lbs" },
            { name: "Lateral Raise Machine", target: "3x10-12", start: "50 lbs" },
            { name: "Pectoral Machine", target: "3x10", start: "210 lbs" },
            { name: "Cable Chest Press", target: "3x8-10", start: "33 lbs" }
        ],
        "Legs & Glutes": [
            { name: "Leg Press", target: "4x8-10", start: "4x45 lbs" },
            { name: "Rear Kick Machine", target: "4x10 each", start: "100 lbs" },
            { name: "Squat or Hack Squat", target: "3x8-10", start: "70 lbs" },
            { name: "Leg Extensions", target: "3x10-12", start: "115 lbs" },
            { name: "Hamstring Curl", target: "3x10-12", start: "Find working weight" },
            { name: "Stairs", target: "12-20 min", start: "Level 6-8" }
        ],
        "Arms": [
            { name: "Zottman Curls", target: "3x8-10", start: "25 lbs" },
            { name: "Incline Dumbbell Curl", target: "3x8-10", start: "30 lbs" },
            { name: "Hammer Curl", target: "3x10", start: "25 lbs" },
            { name: "Tricep Machine", target: "3x10", start: "90 lbs" },
            { name: "Cable Rope Pulldown", target: "3x10-12", start: "100 lbs" },
            { name: "Preacher Curl Machine", target: "3x8-10", start: "50 lbs" }
        ],
        "Back/Shoulders/Core": [
            { name: "Cable Row", target: "3x8-10", start: "100 lbs" },
            { name: "Low Row", target: "3x8-10", start: "90 lbs" },
            { name: "Lat Pulldown Bar", target: "3x8-10", start: "85 lbs" },
            { name: "Vertical Traction Machine", target: "3x8-10", start: "115 lbs" },
            { name: "Reverse Machine", target: "3x10-12", start: "55 lbs" },
            { name: "Crunches", target: "3 sets", start: "Body" }
        ]
    };

    function getTheme() {
        const start = new Date('2026-01-01');
        const diff = Math.floor((new Date() - start) / (1000*60*60*24));
        return themes[(diff % 5) + 1];
    }

    function safeId(value) {
        return value.replace(/[^a-z0-9]/gi, '-').toLowerCase();
    }

    function getHistory() {
        const current = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]");
        if (current.length) return current;

        const legacy = JSON.parse(localStorage.getItem(STORAGE_KEYS.legacyHistory) || "[]");
        return legacy.map(item => ({
            date: item.date,
            routine: item.routine,
            summary: item.summary,
            exercises: []
        }));
    }

    function saveHistory(history) {
        localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history));
    }

    function getLastPerformance(exerciseName) {
        const history = getHistory().slice().reverse();

        for (const session of history) {
            if (!session.exercises) continue;
            const match = session.exercises.find(ex => ex.name === exerciseName && (ex.weight || ex.reps || ex.notes));
            if (match) return { ...match, date: session.date };
        }

        return null;
    }

    function formatLast(last, fallback) {
        if (!last) return `Starter: ${fallback || 'Find a solid working weight'}`;

        const parts = [];
        if (last.weight) parts.push(last.weight);
        if (last.reps) parts.push(`${last.reps} reps`);
        if (last.notes) parts.push(last.notes);

        return `Last time (${last.date}): ${parts.join(' • ')}`;
    }

    function useLast(exerciseName) {
        const last = getLastPerformance(exerciseName);
        if (!last) return;

        const id = safeId(exerciseName);
        document.getElementById(`w-${id}`).value = last.weight || '';
        document.getElementById(`r-${id}`).value = last.reps || '';
        document.getElementById(`n-${id}`).value = last.notes || '';
    }

    function todayKey() {
        return new Date().toISOString().slice(0, 10);
    }

    function getProteinLog() {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.protein) || "{}");
    }

    function saveProteinLog(log) {
        localStorage.setItem(STORAGE_KEYS.protein, JSON.stringify(log));
    }

    function getProteinGoal() {
        return Number(localStorage.getItem(STORAGE_KEYS.proteinGoal) || 180);
    }

    function setProteinGoal() {
        const goal = Number(document.getElementById('protein-goal').value);
        if (!goal || goal < 50) return;
        localStorage.setItem(STORAGE_KEYS.proteinGoal, String(goal));
        showView('Protein');
    }

    function addProtein() {
        const grams = Number(document.getElementById('protein-grams').value);
        const source = document.getElementById('protein-source').value.trim();
        const time = document.getElementById('protein-time').value;

        if (!grams || grams <= 0) return;

        const log = getProteinLog();
        const key = todayKey();
        log[key] = log[key] || [];
        log[key].push({
            grams,
            source: source || 'Protein',
            time: time || new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        });

        saveProteinLog(log);
        showView('Protein');
    }

    function deleteProtein(index) {
        const log = getProteinLog();
        const key = todayKey();
        if (!log[key]) return;

        log[key].splice(index, 1);
        saveProteinLog(log);
        showView('Protein');
    }

    function showView(name) {
        const theme = getTheme();
        document.body.style.backgroundImage = `url('${theme.bg}')`;

        document.querySelectorAll('.tab-btn').forEach(button => {
            const isHome = name === 'Home' && button.innerText === 'Lounge';
            button.classList.toggle('active', button.innerText === name || isHome);
        });

        const container = document.getElementById('content');
        container.innerHTML = '';

        if (name === 'Home') {
            const goal = getProteinGoal();
            const proteinLog = getProteinLog()[todayKey()] || [];
            const proteinTotal = proteinLog.reduce((sum, item) => sum + Number(item.grams || 0), 0);

            container.innerHTML = `
                <div class="vibe-card">
                    <div class="vibe-label">Today's Vibe: ${theme.name}</div>
                    <div class="quote">${theme.quote}</div>
                    <a href="${theme.playlist}" target="_blank" rel="noopener" class="spotify-link">▶ Open Vibe Playlist</a>
                </div>
                <div class="home-grid">
                    <div class="shortcut-card" onclick="showView('Chest & Shoulders')">CHEST</div>
                    <div class="shortcut-card" onclick="showView('Legs & Glutes')">LEGS</div>
                    <div class="shortcut-card" onclick="showView('Arms')">ARMS</div>
                    <div class="shortcut-card" onclick="showView('Back/Shoulders/Core')">BACK</div>
                    <div class="shortcut-card home-wide" onclick="showView('Protein')">PROTEIN: ${proteinTotal}g / ${goal}g</div>
                </div>
            `;
            return;
        }

        if (name === 'Protein') {
            renderProtein(container);
            return;
        }

        if (name === 'History') {
            renderHistory(container);
            return;
        }

        renderRoutine(container, name);
    }

    function renderRoutine(container, name) {
        container.innerHTML = `<div class="section-title">${name}</div>`;

        routines[name].forEach(ex => {
            const id = safeId(ex.name);
            const last = getLastPerformance(ex.name);
            const lastText = formatLast(last, ex.start);

            container.innerHTML += `
                <div class="exercise-card">
                    <div class="ex-header">
                        <div class="ex-name">${ex.name}</div>
                        <div class="ex-target">${ex.target}</div>
                    </div>
                    <div class="last-line">${lastText}</div>
                    <div class="input-group">
                        <div>
                            <label for="w-${id}">Weight</label>
                            <input inputmode="decimal" type="text" placeholder="${last?.weight || ex.start || 'lbs'}" id="w-${id}">
                        </div>
                        <div>
                            <label for="r-${id}">Reps</label>
                            <input inputmode="numeric" type="text" placeholder="${last?.reps || 'reps/sets'}" id="r-${id}">
                        </div>
                        <div class="input-row-full">
                            <label for="n-${id}">Notes</label>
                            <textarea placeholder="Pain-free? Easy/hard? Form notes?" id="n-${id}"></textarea>
                        </div>
                    </div>
                    ${last ? `<button class="small-btn" onclick="useLast('${ex.name.replace(/'/g, "\\'")}')">Use Last Numbers</button>` : ''}
                </div>`;
        });

        container.innerHTML += `<button class="finish-btn" onclick="finish('${name}')">Complete Session</button>`;
    }

    function renderHistory(container) {
        const hist = getHistory().slice().reverse();

        container.innerHTML = `<div class="section-title">History</div>`;

        if (!hist.length) {
            container.innerHTML += `<div class="history-card"><strong>No sessions yet.</strong><p class="muted">Complete a workout and your most recent numbers will appear here and on future exercise cards.</p></div>`;
            return;
        }

        hist.forEach(session => {
            const exerciseList = (session.exercises || []).filter(ex => ex.weight || ex.reps || ex.notes);
            const listHtml = exerciseList.length
                ? `<ul class="history-list">${exerciseList.map(ex => `<li><strong>${ex.name}:</strong> ${[ex.weight, ex.reps ? `${ex.reps} reps` : '', ex.notes].filter(Boolean).join(' • ')}</li>`).join('')}</ul>`
                : `<p class="muted">${session.summary || 'Workout completed.'}</p>`;

            container.innerHTML += `
                <div class="history-card">
                    <strong>${session.date}</strong><br>
                    <small>${session.routine}</small>
                    ${listHtml}
                </div>`;
        });
    }

    function renderProtein(container) {
        const log = getProteinLog();
        const key = todayKey();
        const entries = log[key] || [];
        const total = entries.reduce((sum, item) => sum + Number(item.grams || 0), 0);
        const goal = getProteinGoal();
        const progress = Math.min(100, Math.round((total / goal) * 100));

        container.innerHTML = `
            <div class="section-title">Protein Tracker</div>
            <div class="protein-card">
                <strong>Today's Protein</strong>
                <div class="protein-total">${total}g</div>
                <div class="muted">Goal: ${goal}g. Aim for steady servings, especially midday and after training, instead of trying to cram it all late.</div>
                <div class="progress-wrap"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>

            <div class="protein-card">
                <strong>Add Protein</strong>
                <div class="input-group" style="margin-top:12px;">
                    <div>
                        <label for="protein-grams">Grams</label>
                        <input inputmode="numeric" type="number" id="protein-grams" placeholder="35">
                    </div>
                    <div>
                        <label for="protein-time">Time</label>
                        <input type="time" id="protein-time">
                    </div>
                    <div class="input-row-full">
                        <label for="protein-source">Source</label>
                        <input type="text" id="protein-source" placeholder="Shake, eggs, chicken, Greek yogurt...">
                    </div>
                </div>
                <button class="finish-btn" onclick="addProtein()">Add Protein</button>
            </div>

            <div class="protein-card">
                <strong>Timing Guide</strong>
                <p class="muted">Simple target: 30-50g per serving, 3-5 times per day. Practical windows: late morning, lunch, post-workout, dinner, and a lighter evening option if needed. Avoid making your only large protein hit very early or right before bed.</p>
            </div>

            <div class="protein-card">
                <strong>Daily Goal</strong>
                <div class="input-group" style="margin-top:12px;">
                    <div class="input-row-full">
                        <label for="protein-goal">Protein Goal</label>
                        <input inputmode="numeric" type="number" id="protein-goal" value="${goal}">
                    </div>
                </div>
                <button class="secondary-btn" onclick="setProteinGoal()">Save Goal</button>
            </div>

            <div class="protein-card">
                <strong>Today's Log</strong>
                ${entries.length ? entries.map((item, index) => `
                    <div class="protein-log-row">
                        <span>${item.time} — ${item.grams}g ${item.source ? `• ${item.source}` : ''}</span>
                        <button class="delete-btn" onclick="deleteProtein(${index})">Delete</button>
                    </div>
                `).join('') : `<p class="muted">No protein logged yet today.</p>`}
            </div>
        `;
    }

    function finish(routine) {
        const theme = getTheme();
        const exercises = routines[routine].map(ex => {
            const id = safeId(ex.name);
            return {
                name: ex.name,
                target: ex.target,
                weight: document.getElementById(`w-${id}`).value.trim(),
                reps: document.getElementById(`r-${id}`).value.trim(),
                notes: document.getElementById(`n-${id}`).value.trim()
            };
        });

        const completed = exercises.filter(ex => ex.weight || ex.reps || ex.notes);
        const summary = completed.map(ex => `${ex.name}: ${[ex.weight, ex.reps ? `${ex.reps} reps` : '', ex.notes].filter(Boolean).join(' • ')}`).join(", ");

        const history = getHistory();
        history.push({
            date: new Date().toLocaleDateString(),
            timestamp: new Date().toISOString(),
            routine,
            summary,
            exercises
        });
        saveHistory(history);

        const overlay = document.getElementById('victoryOverlay');
        const badge = document.getElementById('victoryBadge');
        badge.src = theme.badge;
        overlay.style.display = 'flex';
        setTimeout(() => badge.style.transform = 'scale(1)', 100);

        setTimeout(() => {
            overlay.style.display = 'none';
            badge.style.transform = 'scale(0.5)';
            showView('History');
        }, 2200);
    }

    showView('Home');
</script>
</body>
</html>
